<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dine at 7 - Reviews</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #ff6a00, #ffb347);
    color: white;
    text-align: center;
    padding: 20px;
}

/* RATING */
.rating-box {
    max-width: 900px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.rating {
    font-size: 40px;
    font-weight: bold;
    color: #ff9800;
}

/* SWIPE CAROUSEL */
.carousel {
    display: flex;
    overflow-x: auto;
    gap: 15px;
    padding: 20px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
}

.carousel::-webkit-scrollbar {
    display: none;
}

.review-card {
    min-width: 250px;
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    scroll-snap-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.review-card:hover {
    transform: scale(1.05);
}

.stars {
    color: #ff9800;
}

/* POPUP */
.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: white;
    padding: 25px;
    width: 320px;
    border-radius: 12px;
    text-align: center;
    position: relative;
    animation: pop 0.3s ease;
}

@keyframes pop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.close {
    position: absolute;
    right: 10px;
    top: 5px;
    font-size: 22px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <h1>DINE AT 7</h1>
    <p>Swipe reviews like Instagram • Tap to open</p>
</header>

<div class="rating-box">
    <div class="rating">4.6 ⭐</div>
    <p>49 Google Reviews</p>
</div>

<!-- CAROUSEL -->
<div class="carousel">

    <div class="review-card" onclick="openPopup('Manish Kandari','★★★★★','Really liked the food and positive atmosphere.')">
        <b>Manish Kandari</b>
        <div class="stars">★★★★★</div>
        <p>Tap to read</p>
    </div>

    <div class="review-card" onclick="openPopup('Ashish Ramteke','★★★★★','Amazing ambiance and top food quality!')">
        <b>Ashish Ramteke</b>
        <div class="stars">★★★★★</div>
        <p>Tap to read</p>
    </div>

    <div class="review-card" onclick="openPopup('Himanshu Sakhare','★★★★☆','Great food, friendly service, cozy atmosphere.')">
        <b>Himanshu Sakhare</b>
        <div class="stars">★★★★☆</div>
        <p>Tap to read</p>
    </div>

    <div class="review-card" onclick="openPopup('Rohit Patil','★★★★★','Best place for family dinners and birthdays!')">
        <b>Rohit Patil</b>
        <div class="stars">★★★★★</div>
        <p>Tap to read</p>
    </div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
    <div class="popup-content">
        <span class="close" onclick="closePopup()">×</span>
        <h3 id="name"></h3>
        <div id="stars" class="stars"></div>
        <p id="text"></p>
    </div>
</div>

<script>
function openPopup(name, stars, text) {
    document.getElementById("popup").style.display = "flex";
    document.getElementById("name").innerText = name;
    document.getElementById("stars").innerText = stars;
    document.getElementById("text").innerText = text;
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

window.onclick = function(event) {
    let popup = document.getElementById("popup");
    if (event.target === popup) {
        popup.style.display = "none";
    }
}
</script>

</body>
</html>
